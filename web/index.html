<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Position</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* ── Reset & base ─────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:          #060a12;
  --bg2:         #09101e;
  --card:        #0d1828;
  --card2:       #131e2e;
  --card3:       #192538;
  --border:      rgba(148,163,184,.07);
  --border2:     rgba(148,163,184,.13);
  --txt:         #e2e8f0;
  --txt2:        #7d8fa8;
  --txt3:        #3f5068;
  --accent:      #6366f1;
  --accent2:     #818cf8;
  --accent-glow: rgba(99,102,241,.2);
  --green:       #10b981;
  --green-dim:   rgba(16,185,129,.13);
  --red:         #f87171;
  --red-dim:     rgba(248,113,113,.13);
  --amber:       #fbbf24;
  --amber-dim:   rgba(251,191,36,.13);
  --sidebar:     220px;
  --header:      56px;
  --radius:      9px;
  --radius-lg:   13px;
  --shadow-sm:   0 1px 4px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.03);
  --shadow:      0 4px 20px rgba(0,0,0,.5);
  --topbar-bg:   rgba(6,10,18,.88);
}

:root[data-theme="light"]{
  --bg:          #f0f4f9;
  --bg2:         #ffffff;
  --card:        #ffffff;
  --card2:       #eaf0f8;
  --card3:       #dde6f0;
  --border:      rgba(15,23,42,.08);
  --border2:     rgba(15,23,42,.15);
  --txt:         #0f172a;
  --txt2:        #374151;
  --txt3:        #6b7280;
  --accent:      #4f46e5;
  --accent2:     #6366f1;
  --accent-glow: rgba(79,70,229,.12);
  --green:       #059669;
  --green-dim:   rgba(5,150,105,.1);
  --red:         #dc2626;
  --red-dim:     rgba(220,38,38,.1);
  --amber:       #d97706;
  --amber-dim:   rgba(217,119,6,.1);
  --shadow-sm:   0 1px 4px rgba(0,0,0,.08);
  --shadow:      0 4px 20px rgba(0,0,0,.1);
  --topbar-bg:   rgba(255,255,255,.9);
}

html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit}

/* ── Layout ───────────────────────────────────────────────────────── */
#app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ──────────────────────────────────────────────────────── */
#sidebar{
  width:var(--sidebar);flex-shrink:0;
  background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;position:relative;
}
#sidebar::after{
  content:'';position:absolute;top:0;left:0;right:0;height:200px;
  background:linear-gradient(180deg,rgba(99,102,241,.06) 0%,transparent 100%);
  pointer-events:none;
}

.sidebar-logo{
  display:flex;align-items:center;gap:11px;
  padding:16px 14px 14px;
  border-bottom:1px solid var(--border);
  position:relative;z-index:1;
}
.logo-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,#6366f1 0%,#7c3aed 100%);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:0 4px 14px rgba(99,102,241,.4);
}
.logo-mark svg{color:#fff;width:16px;height:16px;stroke-width:2.5}
.logo-text{font-weight:700;font-size:13.5px;letter-spacing:-.3px;line-height:1.2;color:var(--txt)}
.logo-sub{font-size:10px;color:var(--txt3);margin-top:1px;letter-spacing:.02em}

nav{flex:1;padding:10px 8px;overflow-y:auto;position:relative;z-index:1}
.nav-group{margin-bottom:6px}
.nav-group-label{
  font-size:9.5px;font-weight:700;color:var(--txt3);
  text-transform:uppercase;letter-spacing:.12em;
  padding:10px 10px 5px;
}
.nav-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:8px;
  color:var(--txt2);font-weight:500;font-size:13px;
  transition:background .15s,color .15s,box-shadow .15s;
  cursor:pointer;user-select:none;margin-bottom:1px;
  position:relative;
}
.nav-item:hover{background:rgba(148,163,184,.07);color:var(--txt)}
.nav-item.active{
  background:rgba(99,102,241,.14);color:var(--accent2);
  box-shadow:inset 2.5px 0 0 var(--accent);
}
:root[data-theme="light"] .nav-item:hover{background:rgba(15,23,42,.05)}
:root[data-theme="light"] .nav-item.active{background:rgba(79,70,229,.1);color:var(--accent);box-shadow:inset 2.5px 0 0 var(--accent)}
.nav-item .ni{display:flex;align-items:center;justify-content:center;width:17px;flex-shrink:0}
.nav-item svg{width:15px;height:15px;stroke-width:1.9}

.sidebar-footer{padding:12px 14px;border-top:1px solid var(--border);position:relative;z-index:1}
.sidebar-ver{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--txt3)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;animation:pulse-dot 2.5s ease infinite}
@keyframes pulse-dot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(16,185,129,.4)}50%{opacity:.7;box-shadow:0 0 0 4px rgba(16,185,129,0)}}

/* ── Main ─────────────────────────────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{
  height:var(--header);flex-shrink:0;
  background:var(--topbar-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 22px;gap:10px;
}
#page-title{font-weight:700;font-size:15px;flex:1;letter-spacing:-.25px}
.topbar-pill{
  font-size:11px;color:var(--txt3);
  background:var(--card2);border:1px solid var(--border);
  border-radius:20px;padding:3px 10px;
  display:flex;align-items:center;gap:5px;
}
.topbar-pill-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse-dot 2.5s ease infinite}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:500;
  border:1px solid var(--border2);background:var(--card2);color:var(--txt);
  transition:background .15s,border-color .15s,box-shadow .15s;
  white-space:nowrap;
}
.btn:hover{background:var(--card3);border-color:rgba(148,163,184,.2);box-shadow:var(--shadow-sm)}
.btn svg{width:13px;height:13px;flex-shrink:0;stroke-width:2}
.btn-accent{
  background:var(--accent);border-color:rgba(99,102,241,.6);color:#fff;
  box-shadow:0 2px 10px rgba(99,102,241,.35);
}
.btn-accent:hover{background:#5254e8;border-color:#5254e8;box-shadow:0 4px 16px rgba(99,102,241,.45)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-sm svg{width:12px;height:12px}
.btn-icon{padding:5px 6px;min-width:30px;justify-content:center}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:rgba(148,163,184,.07);border-color:var(--border)}

#content{flex:1;overflow-y:auto;padding:20px 22px 40px;scroll-behavior:smooth}

/* ── Cards ────────────────────────────────────────────────────────── */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:18px 20px;
  box-shadow:var(--shadow-sm);
}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em}
.card-title-md{font-size:13px;font-weight:600;color:var(--txt2);letter-spacing:-.1px}

/* ── KPI grid ─────────────────────────────────────────────────────── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:7px}
.kpi-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:7px}
.kpi-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:7px}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}

.kpi{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;
  border-left:3px solid var(--border2);
  position:relative;overflow:hidden;
  transition:border-left-color .2s,box-shadow .2s,background .15s;
}
.kpi::before{
  content:'';position:absolute;top:0;left:3px;right:0;height:1px;
  background:linear-gradient(90deg,var(--kpi-accent,var(--border2)) 0%,transparent 60%);
  opacity:.6;
}
.kpi:hover{box-shadow:0 2px 10px rgba(0,0,0,.3);background:var(--card2)}
.kpi.accent{--kpi-accent:var(--accent);border-left-color:var(--accent)}
.kpi.green {--kpi-accent:var(--green); border-left-color:var(--green)}
.kpi.red   {--kpi-accent:var(--red);   border-left-color:var(--red)}
.kpi.amber {--kpi-accent:var(--amber); border-left-color:var(--amber)}
.kpi-label{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.kpi-value{font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-.5px;margin-bottom:2px;color:var(--txt)}
.kpi-delta{font-size:11px;font-weight:600;display:flex;align-items:center;gap:2px}
.kpi-delta.pos{color:var(--green)}
.kpi-delta.neg{color:var(--red)}
.kpi-delta.neu{color:var(--txt3)}

/* ── Section header ───────────────────────────────────────────────── */
.section{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.section h2{font-size:12px;font-weight:700;color:var(--txt2);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.section-line{flex:1;height:1px;background:var(--border)}
.divider{border:none;border-top:1px solid var(--border);margin:20px 0}

/* ── Summary strip ────────────────────────────────────────────────── */
.summary-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);
  margin-bottom:10px;overflow:hidden;
}
.summary-row{
  display:grid;grid-template-columns:repeat(4,1fr);
}
.summary-row.r3{grid-template-columns:repeat(3,1fr)}
.summary-row.r2{grid-template-columns:repeat(2,1fr)}
.summary-row + .summary-row{border-top:1px solid var(--border)}
.summary-card-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 14px;border-bottom:1px solid var(--border);
  font-size:11px;font-weight:700;color:var(--txt2);
  text-transform:uppercase;letter-spacing:.06em;
}
.summary-cell{
  padding:10px 14px;position:relative;
}
.summary-cell + .summary-cell{border-left:1px solid var(--border)}
.summary-cell::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--sc-accent,transparent);opacity:.7;border-radius:0;
}
.summary-cell.accent{--sc-accent:var(--accent)}
.summary-cell.green {--sc-accent:var(--green)}
.summary-cell.red   {--sc-accent:var(--red)}
.summary-cell.amber {--sc-accent:var(--amber)}
.sc-label{font-size:9.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.sc-value{font-size:17px;font-weight:700;line-height:1.15;letter-spacing:-.4px;color:var(--txt)}
.sc-delta{font-size:11px;font-weight:600;margin-top:2px;display:flex;align-items:center;gap:2px}
.sc-delta.pos{color:var(--green)}
.sc-delta.neg{color:var(--red)}
.sc-delta.neu{color:var(--txt3)}

/* ── Charts ───────────────────────────────────────────────────────── */
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}
.chart-row.wide{grid-template-columns:1fr}
.chart-canvas-wrap{position:relative;height:280px}
.chart-canvas-wrap.tall{height:340px}

.comp-detail-list{
  margin-top:10px;max-height:230px;overflow-y:auto;
  border:1px solid var(--border);border-radius:8px;background:var(--card2);
}
.comp-list-head,.comp-list-row{
  display:grid;grid-template-columns:1fr 70px 105px;gap:10px;align-items:center;
  padding:8px 10px;
}
.comp-list-head{border-bottom:1px solid var(--border);font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em}
.comp-list-row{border-bottom:1px solid var(--border)}
.comp-list-row:last-child{border-bottom:none}
.comp-name{color:var(--txt);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-pct{color:var(--accent2);font-size:11.5px;font-weight:700;text-align:right}
:root[data-theme="light"] .comp-pct{color:var(--accent)}
.comp-val{color:var(--txt2);font-size:11.5px;text-align:right}

/* ── Two-col breakdown ────────────────────────────────────────────── */
.breakdown-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:11px}

/* ── Correlations ─────────────────────────────────────────────────── */
.corr-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.corr-meta{font-size:11.5px;color:var(--txt3)}
.corr-assets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.corr-matrix-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--card2)}
.corr-table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;font-size:11px}
.corr-table thead th{
  position:sticky;top:0;z-index:2;background:var(--card2);
  border-bottom:1px solid var(--border);padding:8px 9px;text-align:center;
  font-size:10px;font-weight:700;color:var(--txt3);text-transform:none;letter-spacing:.01em;
}
.corr-row-head{
  position:sticky;left:0;z-index:1;background:var(--card2);
  border-right:1px solid var(--border);padding:7px 9px;
  font-size:10px;font-weight:700;color:var(--txt2);white-space:nowrap;
}
.corr-cell{padding:6px 8px;text-align:center;min-width:52px;font-weight:700;border-right:1px solid var(--border)}
.corr-table tbody tr:not(:last-child) .corr-row-head,
.corr-table tbody tr:not(:last-child) .corr-cell{border-bottom:1px solid var(--border)}
.corr-pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.corr-pair-box{border:1px solid var(--border);border-radius:10px;background:var(--card2);overflow:hidden}
.corr-pair-title{padding:8px 10px;font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border)}
.corr-pair-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border)}
.corr-pair-row:last-child{border-bottom:none}
.corr-pair-name{font-size:12px;color:var(--txt);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.corr-pair-val{font-size:11.5px;font-weight:700}
.corr-pair-val.pos{color:var(--green)}
.corr-pair-val.neg{color:var(--red)}
@media(max-width:1000px){.corr-pairs{grid-template-columns:1fr}}

/* ── Tables ───────────────────────────────────────────────────────── */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead tr{background:var(--card2)}
thead th{
  padding:10px 14px;text-align:left;
  font-size:10px;font-weight:700;color:var(--txt3);
  text-transform:uppercase;letter-spacing:.08em;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
.th-sortable{cursor:pointer;user-select:none;transition:color .15s,background .15s}
.th-sortable:hover{color:var(--txt);background:rgba(148,163,184,.06)}
.th-sortable .sort-arrow{font-size:11px;opacity:.9;margin-left:6px}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(148,163,184,.04)}
:root[data-theme="light"] tbody tr:hover{background:rgba(15,23,42,.025)}
tbody tr.row-buy:hover{background:rgba(16,185,129,.05)}
tbody tr.row-sell:hover{background:rgba(248,113,113,.05)}
td{padding:9px 14px;color:var(--txt2);vertical-align:middle}
td.mono{font-family:'SF Mono','Fira Code','JetBrains Mono',monospace;font-size:11.5px;letter-spacing:-.2px}
td.pos{color:var(--green);font-weight:500}
td.neg{color:var(--red);font-weight:500}
td.bold{color:var(--txt);font-weight:600}

/* ── Filter bar ───────────────────────────────────────────────────── */
.filter-bar{
  display:flex;align-items:center;flex-wrap:wrap;gap:10px;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:13px;
  box-shadow:var(--shadow-sm);
}
.filter-group{display:flex;align-items:center;gap:6px}
.filter-label{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.f-input{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:6px;padding:5px 10px;color:var(--txt);font-size:12.5px;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.f-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.f-select{
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:6px;padding:5px 8px;color:var(--txt);font-size:12.5px;
  outline:none;cursor:pointer;transition:border-color .15s;
}
.f-select:focus{border-color:var(--accent)}
.f-select option{background:var(--bg2);color:var(--txt)}
.f-select option:checked{background:var(--accent);color:#fff}

/* ── Stats row ────────────────────────────────────────────────────── */
.stats-row{display:flex;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.stat-chip{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;display:flex;flex-direction:column;gap:3px;
  box-shadow:var(--shadow-sm);min-width:90px;
}
.stat-chip-label{font-size:9.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em}
.stat-chip-value{font-size:17px;font-weight:700;line-height:1.2;letter-spacing:-.5px;color:var(--txt)}

/* ── Pagination ───────────────────────────────────────────────────── */
.pagination{display:flex;align-items:center;gap:8px;margin-top:12px;justify-content:flex-end}
.page-info{font-size:11.5px;color:var(--txt3)}

/* ── Upload zone ──────────────────────────────────────────────────── */
.upload-zone{
  border:2px dashed var(--border2);border-radius:var(--radius-lg);
  padding:36px 24px;text-align:center;cursor:pointer;
  transition:border-color .2s,background .2s;
}
.upload-zone:hover,.upload-zone.drag{
  border-color:var(--accent);
  background:var(--accent-glow);
}
.upload-zone input{display:none}
.upload-icon{font-size:30px;margin-bottom:10px;opacity:.6}
.upload-title{font-weight:600;font-size:14px;margin-bottom:5px;color:var(--txt)}
.upload-sub{font-size:12px;color:var(--txt3);line-height:1.5}

/* ── Pending files ────────────────────────────────────────────────── */
.file-chip{
  display:flex;align-items:center;gap:8px;
  background:var(--card2);border:1px solid var(--border);border-radius:8px;
  padding:8px 12px;font-size:12.5px;
}
.file-chip svg{width:14px;height:14px;color:var(--txt3);flex-shrink:0}
.file-chip-del{
  margin-left:auto;color:var(--txt3);
  background:none;border:none;cursor:pointer;
  transition:color .15s;line-height:1;
  display:flex;align-items:center;padding:2px;border-radius:4px;
}
.file-chip-del:hover{color:var(--red);background:var(--red-dim)}
.file-chip-del svg{width:13px;height:13px}

/* ── Settings ─────────────────────────────────────────────────────── */
.settings-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px}
.stab{
  padding:8px 15px;border-radius:7px 7px 0 0;font-size:12.5px;font-weight:500;
  color:var(--txt3);background:none;border:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .15s,border-color .15s;
}
.stab:hover{color:var(--txt)}
.stab.active{color:var(--accent2);border-bottom-color:var(--accent)}
:root[data-theme="light"] .stab.active{color:var(--accent)}
.stab-content{display:none}
.stab-content.active{display:block}
.form-group{margin-bottom:14px}
.form-label{font-size:10.5px;font-weight:700;color:var(--txt3);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.08em}

  width:100%;background:var(--bg2);border:1px solid var(--border2);

}

.form-textarea{resize:vertical;min-height:260px;font-family:'SF Mono','Fira Code',monospace;font-size:12px;line-height:1.65}
.adj-table{width:100%;border-collapse:collapse;margin-bottom:10px}
.adj-table td,.adj-table th{padding:7px 10px}
.adj-table th{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border);text-align:left}
.adj-table td{border-bottom:1px solid var(--border)}
.adj-table input{
  background:var(--bg2);border:1px solid var(--border2);border-radius:6px;
  padding:5px 9px;color:var(--txt);font-size:12.5px;outline:none;width:100%;
  transition:border-color .15s;
}
.adj-table input:focus{border-color:var(--accent)}
.src-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
.src-card-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.src-card-body{padding:14px;border-top:1px solid var(--border);display:none}
.src-card-body.open{display:block}
.toggle{
  position:relative;width:34px;height:18px;
  background:var(--card3);border:1px solid var(--border2);
  border-radius:20px;cursor:pointer;transition:background .2s,border-color .2s;flex-shrink:0;
}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;
  width:12px;height:12px;border-radius:50%;background:#fff;
  transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.35);
}
.toggle.on::after{transform:translateX(16px)}

/* ── Info/hint boxes ──────────────────────────────────────────────── */
.hint{
  font-size:12px;color:var(--txt3);line-height:1.55;
  background:var(--card2);border:1px solid var(--border);
  border-radius:8px;padding:10px 13px;margin-bottom:14px;
}

/* ── Empty / loading states ───────────────────────────────────────── */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:72px 24px;color:var(--txt3);text-align:center;
}
.empty-icon{margin-bottom:16px;opacity:.4}
.empty-icon svg{width:44px;height:44px;stroke-width:1.3}
.empty-title{font-weight:600;font-size:15px;margin-bottom:6px;color:var(--txt2)}
.empty-sub{font-size:12.5px;max-width:280px;line-height:1.6}
.loading{display:flex;align-items:center;justify-content:center;padding:80px;flex-direction:column;gap:16px}
.spinner{
  width:28px;height:28px;border:2.5px solid var(--border2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{font-size:12px;color:var(--txt3);letter-spacing:.01em}
.skel{
  background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);
  background-size:200% 100%;animation:shimmer 1.6s infinite;border-radius:6px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Toasts ───────────────────────────────────────────────────────── */
#toasts{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{
  padding:12px 16px;border-radius:10px;font-size:12.5px;font-weight:500;
  display:flex;align-items:center;gap:10px;
  animation:toastIn .28s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 8px 32px rgba(0,0,0,.55);border:1px solid;
}
@keyframes toastIn{from{opacity:0;transform:translateX(24px) scale(.95)}to{opacity:1;transform:translateX(0) scale(1)}}
.toast.success{background:#022c22;border-color:#064e3b;color:#6ee7b7}
.toast.error  {background:#450a0a;border-color:#7f1d1d;color:#fca5a5}
.toast.info   {background:#0c1a3a;border-color:#1e3a8a;color:#93c5fd}

/* ── Badges ───────────────────────────────────────────────────────── */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;
  letter-spacing:.02em;white-space:nowrap;
}
.badge.green {background:var(--green-dim);color:var(--green)}
.badge.red   {background:var(--red-dim);  color:var(--red)}
.badge.amber {background:var(--amber-dim);color:var(--amber)}
.badge.indigo{background:rgba(99,102,241,.13);color:var(--accent2)}
:root[data-theme="light"] .badge.indigo{color:var(--accent)}

/* ── Misc ─────────────────────────────────────────────────────────── */
.row-flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.spacer{flex:1}
pre{white-space:pre-wrap;word-break:break-all}
code{font-family:'SF Mono','Fira Code',monospace;font-size:12px;background:var(--card3);padding:2px 5px;border-radius:4px}

<body>

<script>
// ═══════════════════════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════════════════════
let currentPage = null;
const cache     = {};
const charts    = {};
let opsAll      = [];
let opsFiltered = [];
let opsPage     = 0;
let cryptoAll      = [];
let cryptoFiltered = [];
const opsSort = { key: 'Date', dir: 'desc' };
const cryptoSort = { key: 'Date', dir: 'desc' };
const PAGE_SIZE = 60;
const THEME_KEY = 'gp-theme';

// ═══════════════════════════════════════════════════════════════════════
//  Format helpers
// ═══════════════════════════════════════════════════════════════════════
const fmtEur  = n => n == null ? '—' : new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n);
const fmtNum  = n => n == null ? '—' : new Intl.NumberFormat('es-ES',{maximumFractionDigits:4}).format(n);
const fmtPct  = n => n == null ? '—' : (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
const fmtPct0 = n => n == null ? '—' : n.toFixed(2) + '%';
const fmtY    = n => n == null ? '—' : n.toFixed(1) + ' años';
const posNeg  = n => n == null ? 'neu' : (n >= 0 ? 'pos' : 'neg');
const colorOf = n => n == null ? '' : (n >= 0 ? 'green' : 'red');

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function compareRows(a, b, key, dir = 'desc') {
  const av = a?.[key];
  const bv = b?.[key];

  if (av == null && bv == null) return 0;
  if (av == null) return dir === 'asc' ? -1 : 1;
  if (bv == null) return dir === 'asc' ? 1 : -1;

  let cmp = 0;
  const keyLc = String(key || '').toLowerCase();

  if (keyLc === 'date') {
    const ta = Date.parse(av);
    const tb = Date.parse(bv);
    cmp = (Number.isFinite(ta) ? ta : -Infinity) - (Number.isFinite(tb) ? tb : -Infinity);
  } else if (['quantity', 'price', 'value'].includes(keyLc)) {
    cmp = (Number(av) || 0) - (Number(bv) || 0);
  } else {
    const sa = String(av).toLowerCase();
    const sb = String(bv).toLowerCase();
    cmp = sa.localeCompare(sb, 'es', { numeric: true, sensitivity: 'base' });
  }

  return dir === 'asc' ? cmp : -cmp;
}

function sortRows(rows, sortState) {
  return [...rows].sort((a, b) => compareRows(a, b, sortState.key, sortState.dir));
}

function sortArrow(sortState, key) {
  if (sortState.key !== key) return '↕';
  return sortState.dir === 'desc' ? '↓' : '↑';
}

// ═══════════════════════════════════════════════════════════════════════
//  API
// ═══════════════════════════════════════════════════════════════════════
async function api(path, opts = {}) {
  const fetchOpts = { cache: 'no-store', ...opts };
  const res = await fetch(path, fetchOpts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({error: res.statusText}));
    throw new Error(err.error || res.statusText);
  }
  return res.json();
}

async function getTickerDisplayNameMap() {
  if (cache.tickerDisplayNameMap) return cache.tickerDisplayNameMap;

  let ops = cache.operations;
  if (!ops) {
    try {
      ops = await api('/api/operations');
    } catch (_) {
      ops = [];
    }
  }

  const map = {};
  const sorted = [...(ops || [])].sort((a, b) => String(b.Date || '').localeCompare(String(a.Date || '')));
  sorted.forEach(r => {
    const t = String(r.ticker || '').trim();
    const p = String(r.Product || '').trim();
    if (t && p && !map[t]) map[t] = p;
  });

  // Friendly names for common crypto symbols.
  map.BTC = map.BTC || 'Bitcoin';
  map.ETH = map.ETH || 'Ethereum';
  map.SOL = map.SOL || 'Solana';
  map.ADA = map.ADA || 'Cardano';
  map.XRP = map.XRP || 'XRP';
  map.DOT = map.DOT || 'Polkadot';
  map.LINK = map.LINK || 'Chainlink';

  cache.tickerDisplayNameMap = map;
  return map;
}

// ═══════════════════════════════════════════════════════════════════════
//  Icons
// ═══════════════════════════════════════════════════════════════════════
function refreshIcons() {
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

// ═══════════════════════════════════════════════════════════════════════
//  Navigation
// ═══════════════════════════════════════════════════════════════════════
const PAGE_TITLES = {
  dashboard: 'Dashboard', operations: 'Operaciones', crypto: 'Crypto',
  tax: 'Fiscalidad', import: 'Importar', settings: 'Ajustes',
  sources: 'Vests / Fuentes personalizadas'
};

function navigate(page) {
  if (!page || !PAGE_TITLES[page]) page = 'dashboard';
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  document.getElementById('page-title').textContent = PAGE_TITLES[page];
  const showRefresh = ['dashboard','operations','crypto','tax'].includes(page);
  document.getElementById('refresh-btn').style.display = showRefresh ? '' : 'none';
  history.replaceState(null, '', '#' + page);
  renderPage(page);
}

window.addEventListener('hashchange', () => navigate(location.hash.slice(1)));
document.querySelectorAll('.nav-item').forEach(el =>
  el.addEventListener('click', () => navigate(el.dataset.page))
);

function refresh() {
  delete cache[currentPage];
  if (currentPage === 'dashboard') fetch('/api/invalidate').catch(()=>{});
  renderPage(currentPage);
}

function setUpdated() {
  const el = document.getElementById('last-updated');
  if (el) {
    el.innerHTML = `<span class="topbar-pill-dot"></span>${new Date().toLocaleTimeString('es-ES')}`;
    el.style.display = 'flex';
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  Theme
// ═══════════════════════════════════════════════════════════════════════
function getCurrentTheme() {
  return document.documentElement.getAttribute('data-theme') || 'dark';
}

function applyTheme(theme) {
  const t = theme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) {
    btn.innerHTML = t === 'dark'
      ? '<i data-lucide="sun"></i>'
      : '<i data-lucide="moon"></i>';
    btn.title = t === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
    refreshIcons();
  }
}

function toggleTheme() {
  const next = getCurrentTheme() === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch(_) {}
}

function initTheme() {
  let stored = null;
  try { stored = localStorage.getItem(THEME_KEY); } catch(_) {}
  if (stored === 'light' || stored === 'dark') { applyTheme(stored); return; }
  const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  applyTheme(prefersLight ? 'light' : 'dark');
}

// ═══════════════════════════════════════════════════════════════════════
//  Chart helpers
// ═══════════════════════════════════════════════════════════════════════
function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

function gradient(ctx, color, alpha1 = 0.28, alpha2 = 0.01) {
  const g = ctx.createLinearGradient(0, 0, 0, ctx.canvas.height);
  g.addColorStop(0, color.replace(')', `,${alpha1})`).replace('rgb(', 'rgba('));
  g.addColorStop(1, color.replace(')', `,${alpha2})`).replace('rgb(', 'rgba('));
  return g;
}

function getChartDefaults() {
  const isDark = getCurrentTheme() === 'dark';
  return {
    responsive: true, maintainAspectRatio: false,
    animation: { duration: 500, easing: 'easeOutQuart' },
    plugins: {
      legend: {
        display: true,
        labels: {
          color: isDark ? '#7d8fa8' : '#6b7280',
          font: { family: 'Inter', size: 11.5 },
          boxWidth: 10, padding: 16, usePointStyle: true, pointStyleWidth: 8,
        }
      },
      tooltip: {
        mode: 'index', intersect: false,
        backgroundColor: isDark ? '#0d1828' : '#1e293b',
        borderColor: isDark ? 'rgba(148,163,184,.12)' : 'rgba(255,255,255,.15)',
        borderWidth: 1,
        titleColor: isDark ? '#e2e8f0' : '#f1f5f9',
        bodyColor:  isDark ? '#7d8fa8' : '#94a3b8',
        padding: 12, cornerRadius: 10, boxPadding: 5,
      }
    }
  };
}

function getScales() {
  const isDark = getCurrentTheme() === 'dark';
  const grid = isDark ? 'rgba(148,163,184,.05)' : 'rgba(15,23,42,.05)';
  const tick = isDark ? '#3f5068' : '#9ca3af';
  return { grid, tick };
}

const COLORS = ['#6366f1','#8b5cf6','#10b981','#f59e0b','#ef4444','#06b6d4','#f97316','#ec4899','#84cc16','#a78bfa','#34d399','#fb923c','#e879f9','#22d3ee'];
const PIE_COLORS = ['#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd','#8c564b','#e377c2','#7f7f7f','#bcbd22','#17becf','#aec7e8','#ffbb78','#98df8a','#ff9896'];

function toLinearSeries(points) {
  return (points || [])
    .map(p => ({ x: Date.parse(p.x), y: Number(p.y) }))
    .filter(p => Number.isFinite(p.x) && Number.isFinite(p.y))
    .sort((a, b) => a.x - b.x);
}

function trimSeriesFromFirstPositive(valuePoints, investedPoints) {
  const value = toLinearSeries(valuePoints);
  const invested = toLinearSeries(investedPoints);

  let startX = invested.find(p => p.y > 0)?.x;
  if (!Number.isFinite(startX)) {
    startX = value.find(p => Math.abs(p.y) > 1e-9)?.x;
  }
  if (!Number.isFinite(startX)) {
    return { value, invested };
  }

  return {
    value: value.filter(p => p.x >= startX),
    invested: invested.filter(p => p.x >= startX),
  };
}

function fmtXAxisTick(ms) {
  if (!Number.isFinite(ms)) return '';
  return new Date(ms).toLocaleDateString('es-ES', { month: 'short', year: 'numeric' });
}

function fmtTooltipDate(ms) {
  if (!Number.isFinite(ms)) return '';
  return new Date(ms).toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
}

const pieOuterLabelsPlugin = {
  id: 'pieOuterLabels',
  afterDatasetsDraw(chart, args, opts) {
    if (!opts || opts.enabled === false) return;

    const dataset = chart.data.datasets?.[0];
    const labels = chart.data.labels || [];
    const meta = chart.getDatasetMeta(0);
    if (!dataset || !meta?.data?.length) return;

    const values = (dataset.data || []).map(v => Number(v) || 0);
    const total = values.reduce((a, b) => a + b, 0);
    if (total <= 0) return;

    const ctx = chart.ctx;
    ctx.save();
    ctx.fillStyle = opts.textColor || (getCurrentTheme() === 'dark' ? '#cbd5e1' : '#334155');
    ctx.font = opts.font || '10px Inter';
    ctx.textBaseline = 'middle';

    const offset = Number(opts.offset) || 16;
    meta.data.forEach((arc, i) => {
      const props = arc.getProps(['x', 'y', 'startAngle', 'endAngle', 'outerRadius'], true);
      const angle = (props.startAngle + props.endAngle) / 2;
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      const x = props.x + cos * (props.outerRadius + offset);
      const y = props.y + sin * (props.outerRadius + offset);
      const label = String(labels[i] ?? '').trim();
      if (!label) return;
      ctx.textAlign = cos >= 0 ? 'left' : 'right';
      ctx.fillText(label, x + (cos >= 0 ? 2 : -2), y);
    });
    ctx.restore();
  }
};

const pieInnerPctPlugin = {
  id: 'pieInnerPct',
  afterDatasetsDraw(chart, args, opts) {
    if (!opts || opts.enabled === false) return;

    const dataset = chart.data.datasets?.[0];
    const meta = chart.getDatasetMeta(0);
    if (!dataset || !meta?.data?.length) return;

    const values = (dataset.data || []).map(v => Number(v) || 0);
    const total = values.reduce((a, b) => a + b, 0);
    if (total <= 0) return;

    const minPct = Number(opts.minPct) || 1;
    const radialFactor = Number(opts.radialFactor) || 0.6;

    const ctx = chart.ctx;
    ctx.save();
    ctx.fillStyle = opts.textColor || '#111827';
    ctx.font = opts.font || '600 10px Inter';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    meta.data.forEach((arc, i) => {
      const pct = (values[i] / total) * 100;
      if (pct < minPct) return;

      const props = arc.getProps(['x', 'y', 'startAngle', 'endAngle', 'outerRadius', 'innerRadius'], true);
      const angle = (props.startAngle + props.endAngle) / 2;
      const radius = props.innerRadius + (props.outerRadius - props.innerRadius) * radialFactor;
      const x = props.x + Math.cos(angle) * radius;
      const y = props.y + Math.sin(angle) * radius;
      ctx.fillText(`${pct.toFixed(1)}%`, x, y);
    });

    ctx.restore();
  }
};

// ═══════════════════════════════════════════════════════════════════════
//  Page renderer dispatcher
// ═══════════════════════════════════════════════════════════════════════
async function renderPage(page) {
  const content = document.getElementById('content');
  content.innerHTML = `<div class="loading"><div class="spinner"></div><div class="loading-msg">Cargando ${PAGE_TITLES[page]}…</div></div>`;
  Object.keys(charts).forEach(destroyChart);
  try {
    await ({
      dashboard:  renderDashboard,
      operations: renderOperations,
      crypto:     renderCrypto,
      tax:        renderTax,
      import:     renderImport,
      settings:   renderSettings,
      sources:    renderSources,
    }[page] || renderDashboard)();
    setUpdated();
    refreshIcons();
  } catch (e) {
    content.innerHTML = `<div class="empty-state"><div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg></div><div class="empty-title">Error cargando la página</div><div class="empty-sub">${e.message}</div></div>`;
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  DASHBOARD
// ═══════════════════════════════════════════════════════════════════════
async function renderDashboard() {
  if (!cache.dashboard) cache.dashboard = await api(`/api/dashboard?_=${Date.now()}`);
  let d = cache.dashboard;
  if (!Array.isArray(d?.composition_full) || !d.composition_full.length) {
    try {
      const fresh = await api(`/api/dashboard?refresh=true&_=${Date.now()}`);
      if (Array.isArray(fresh?.composition_full) && fresh.composition_full.length) {
        cache.dashboard = fresh;
        d = fresh;
      }
    } catch (_err) {
      // Keep current payload if refresh fails.
    }
  }
  const tickerDisplayNameMap = await getTickerDisplayNameMap();
  if (d.error) {
    document.getElementById('content').innerHTML = `<div class="empty-state"><div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2 2V7"/><path d="M3 7l9-4 9 4"/></svg></div><div class="empty-title">Sin datos de cartera</div><div class="empty-sub">${d.error}</div></div>`;
    return;
  }
  const m  = d.metrics;
  const hc = d.has_crypto;
  const alfa = ((m.twr_total_anual||0) - (m.benchmark_annual||0));
  const corr = d.correlation || {};
  const corrThreshold = Number(corr.threshold_pct || 1.5);
  const corrAssets = Array.isArray(corr.assets) ? corr.assets : [];
  const corrMatrix = corr.matrix || {};
  const corrLabels = Array.isArray(corrMatrix.labels) ? corrMatrix.labels : [];
  const corrValues = Array.isArray(corrMatrix.values) ? corrMatrix.values : [];
  const corrHasMatrix = corrLabels.length >= 2 && corrValues.length === corrLabels.length;
  const corrDays = Number(corr.history_days || 0);

  const corrAssetMap = Object.fromEntries(corrAssets.map(a => [String(a.symbol || ''), a]));
  const corrName = (symbol) => {
    const key = String(symbol || '').trim();
    return corrAssetMap[key]?.name || tickerDisplayNameMap[key] || key;
  };

  const corrCellHtml = (rawVal) => {
    const v = Number(rawVal);
    if (!Number.isFinite(v)) return `<td class="corr-cell">—</td>`;
    const a = Math.min(0.78, Math.max(0.10, 0.10 + Math.abs(v) * 0.68));
    const bg = v >= 0 ? `rgba(16,185,129,${a})` : `rgba(248,113,113,${a})`;
    const tc = Math.abs(v) >= 0.45 ? '#ffffff' : (getCurrentTheme() === 'dark' ? '#e2e8f0' : '#1f2937');
    return `<td class="corr-cell" style="background:${bg};color:${tc}">${v.toFixed(2)}</td>`;
  };

  const corrMatrixHtml = corrHasMatrix ? `
<div class="corr-matrix-wrap">
  <table class="corr-table">
    <thead>
      <tr>
        <th style="left:0;position:sticky;z-index:3">Activo</th>
        ${corrLabels.map(sym => `<th title="${escapeHtml(corrName(sym))}">${escapeHtml(sym)}</th>`).join('')}
      </tr>
    </thead>
    <tbody>
      ${corrLabels.map((rowSym, i) => `
      <tr>
        <th class="corr-row-head" title="${escapeHtml(corrName(rowSym))}">${escapeHtml(rowSym)}</th>
        ${(corrValues[i] || []).map(v => corrCellHtml(v)).join('')}
      </tr>
      `).join('')}
    </tbody>
  </table>
</div>` : `<div class="empty-state" style="padding:26px 16px"><div class="empty-sub">${escapeHtml(corr.note || 'Sin datos suficientes para construir la matriz de correlaciones.')}</div></div>`;

  const corrPairRow = (pair) => {
    const v = Number(pair?.corr);
    const cls = Number.isFinite(v) ? (v >= 0 ? 'pos' : 'neg') : '';
    const a1 = String(pair?.asset_1 || '—');
    const a2 = String(pair?.asset_2 || '—');
    const label = `${a1} ↔ ${a2}`;
    const fullPairTitle = `${corrName(a1)} ↔ ${corrName(a2)}`;
    return `<div class="corr-pair-row" title="${escapeHtml(fullPairTitle)}">
      <div class="corr-pair-name" title="${escapeHtml(fullPairTitle)}">${escapeHtml(label)}</div>
      <div class="corr-pair-val ${cls}" title="${escapeHtml(fullPairTitle)}">${Number.isFinite(v) ? v.toFixed(3) : '—'}</div>
    </div>`;
  };

  const topPos = Array.isArray(corr.top_positive) ? corr.top_positive : [];
  const topNeg = Array.isArray(corr.top_negative) ? corr.top_negative : [];
  const corrAssetsHtml = corrAssets.length
    ? corrAssets.map(a => `<span class="badge indigo" title="${escapeHtml(corrName(a.symbol || ''))}">${escapeHtml(String(a.symbol || ''))} ${Number(a.weight || 0).toFixed(2)}%</span>`).join('')
    : '<span class="badge amber">Sin activos filtrados</span>';

  document.getElementById('content').innerHTML = `
${section('Resumen total')}
<div class="summary-card">
  <div class="summary-row">
    ${sc('Capital aportado', fmtEur(m.capital_total), null, 'accent')}
    ${sc('Valor actual', fmtEur(m.valor_total), null, 'accent')}
    ${sc('Plusvalía', fmtEur(m.plusvalia_total), fmtPct(m.rentabilidad_total), colorOf(m.plusvalia_total))}
    ${sc('CAGR', fmtPct0(m.cagr_total), null, colorOf(m.cagr_total))}
  </div>
  <div class="summary-row">
    ${sc('TWR Total', fmtPct(m.twr_total_total), null, colorOf(m.twr_total_total))}
    ${sc('TWR Anualizado', fmtPct(m.twr_total_anual), null, colorOf(m.twr_total_anual))}
    ${sc('Período', fmtY(m.anhos_totales), null, 'accent')}
    ${sc('Fecha análisis', m.fecha_actual || '—', null, 'accent')}
  </div>
</div>

${m.benchmark_ticker ? `
${section('vs ' + (m.benchmark_name || m.benchmark_ticker))}
<div class="summary-card">
  <div class="summary-row r3">
    ${sc('Benchmark total', fmtPct(m.benchmark_total), null, 'amber')}
    ${sc('Benchmark anual', fmtPct(m.benchmark_annual), null, 'amber')}
    ${sc('Alfa (TWR − BM)', fmtPct(alfa), null, colorOf(alfa))}
  </div>
</div>` : ''}

${section('Desglose por activo')}
<div class="breakdown-row">
  <div class="summary-card">
    <div class="summary-card-header">
      <span>Acciones / Renta Variable</span>
      <span class="badge indigo">${fmtPct0(m.peso_acciones)} cartera</span>
    </div>
    <div class="summary-row r2">
      ${sc('Capital', fmtEur(m.capital_aportado_acciones), null, 'accent')}
      ${sc('Valor', fmtEur(m.valor_actual_acciones), null, 'accent')}
    </div>
    <div class="summary-row r2">
      ${sc('Plusvalía', fmtEur(m.plusvalia_acciones), fmtPct(m.rentabilidad_acciones), colorOf(m.plusvalia_acciones))}
      ${sc('CAGR', fmtPct0(m.cagr_acciones), null, colorOf(m.cagr_acciones))}
    </div>
    <div class="summary-row r2">
      ${sc('TWR Total', fmtPct(m.twr_acciones_total), null, colorOf(m.twr_acciones_total))}
      ${sc('TWR Anual', fmtPct(m.twr_acciones_anual), null, colorOf(m.twr_acciones_anual))}
    </div>
  </div>
  <div class="summary-card">
    <div class="summary-card-header">
      <span>Criptomonedas</span>
      ${hc ? `<span class="badge amber">${fmtPct0(m.peso_crypto)} cartera</span>` : ''}
    </div>
    ${hc ? `
    <div class="summary-row r2">
      ${sc('Capital', fmtEur(m.capital_aportado_crypto), null, 'amber')}
      ${sc('Valor', fmtEur(m.valor_actual_crypto), null, 'amber')}
    </div>
    <div class="summary-row r2">
      ${sc('Plusvalía', fmtEur(m.plusvalia_crypto), fmtPct(m.rentabilidad_crypto), colorOf(m.plusvalia_crypto))}
      ${sc('CAGR', fmtPct0(m.cagr_crypto), null, colorOf(m.cagr_crypto))}
    </div>
    <div class="summary-row r2">
      ${sc('TWR Total', fmtPct(m.twr_cripto_total), null, colorOf(m.twr_cripto_total))}
      ${sc('TWR Anual', fmtPct(m.twr_cripto_anual), null, colorOf(m.twr_cripto_anual))}
    </div>` : `<div class="empty-state" style="padding:36px 20px"><div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 015 0v.5a2.5 2.5 0 01-5 0V9zM12 14v3"/></svg></div><div class="empty-sub">Sin datos crypto configurados</div></div>`}
  </div>
</div>

${section('Evolución del portfolio')}
<div class="card" style="margin-bottom:13px">
  <div class="card-header">
    <span class="card-title">Valor de cartera vs capital invertido${m.benchmark_ticker ? ' vs benchmark' : ''}</span>
  </div>
  <div class="chart-canvas-wrap tall"><canvas id="chart-portfolio"></canvas></div>
</div>

<div class="chart-row">
  <div class="card">
    <div class="card-header"><span class="card-title">Composición actual</span></div>
    <div class="chart-canvas-wrap" style="height:280px"><canvas id="chart-donut"></canvas></div>
    <div id="composition-detail-list" class="comp-detail-list"></div>
  </div>
  <div class="card">
    <div class="card-header"><span class="card-title">${hc ? 'Evolución crypto' : 'Top activos por valor'}</span></div>
    <div class="chart-canvas-wrap"><canvas id="chart-right"></canvas></div>
    ${hc ? `<div id="crypto-breakdown-detail-list" class="comp-detail-list" style="margin-top:12px"></div>` : ''}
  </div>
</div>

${section('Correlaciones')}
<div class="card" style="margin-bottom:13px">
  <div class="corr-head">
    <span class="card-title">Matriz de correlación de retornos diarios</span>
    <span class="badge indigo">Activos > ${corrThreshold.toFixed(2)}%</span>
    <span class="corr-meta">Histórico usado: ${corrDays > 0 ? `${corrDays} días` : 'n/d'}</span>
  </div>
  <div class="corr-assets">${corrAssetsHtml}</div>
  ${corrMatrixHtml}
  <div class="corr-pairs">
    <div class="corr-pair-box">
      <div class="corr-pair-title">Top 5 más correlacionados</div>
      ${(topPos.length ? topPos : [{asset_1:'—', asset_2:'—', corr: null}]).map(corrPairRow).join('')}
    </div>
    <div class="corr-pair-box">
      <div class="corr-pair-title">Top 5 menor correlación</div>
      ${(topNeg.length ? topNeg : [{asset_1:'—', asset_2:'—', corr: null}]).map(corrPairRow).join('')}
    </div>
  </div>
</div>
${d.failed_tickers && d.failed_tickers.length ? `<div class="hint">Sin precio de mercado: ${d.failed_tickers.join(', ')}</div>` : ''}
`;

  const CD = getChartDefaults();
  const SC = getScales();
  const cardBg = getCurrentTheme() === 'dark' ? '#0d1828' : '#ffffff';

  // Portfolio evolution
  const ctxP = document.getElementById('chart-portfolio').getContext('2d');
  const pc = d.portfolio_chart;
  const portfolioSeries = trimSeriesFromFirstPositive(pc.value, pc.invested);
  const portfolioStartX = [
    ...(portfolioSeries.value || []).map(p => p.x),
    ...(portfolioSeries.invested || []).map(p => p.x),
  ].filter(Number.isFinite);
  const minPortfolioStartX = portfolioStartX.length ? Math.min(...portfolioStartX) : undefined;

  let benchmarkSeries = toLinearSeries(pc.benchmark);
  if (Number.isFinite(minPortfolioStartX)) {
    benchmarkSeries = benchmarkSeries.filter(p => p.x >= minPortfolioStartX);
  }

  const benchmarkLooksValid = (
    benchmarkSeries.length >= 2
    && new Set(benchmarkSeries.map(p => Number(p.y).toFixed(4))).size > 1
  );

  const datasets = [
    {
      label: 'Valor cartera',
      data: portfolioSeries.value,
      borderColor: '#6366f1',
      backgroundColor: gradient(ctxP, 'rgb(99,102,241)'),
      fill: true, tension: 0.35, pointRadius: 0, borderWidth: 2.5,
    },
    {
      label: 'Capital invertido',
      data: portfolioSeries.invested,
      borderColor: '#8b5cf6',
      borderDash: [6,4],
      fill: false, tension: 0, pointRadius: 0, borderWidth: 1.8,
    }
  ];
  if (benchmarkLooksValid) {
    datasets.push({
      label: m.benchmark_name || 'Benchmark',
      data: benchmarkSeries,
      borderColor: '#fbbf24',
      borderDash: [3,4],
      fill: false, tension: 0.3, pointRadius: 0, borderWidth: 1.8,
    });
  }

  const portfolioX = datasets.flatMap(ds => (ds.data || []).map(p => p.x)).filter(Number.isFinite);
  const portfolioMinX = portfolioX.length ? Math.min(...portfolioX) : undefined;
  const portfolioMaxX = portfolioX.length ? Math.max(...portfolioX) : undefined;

  charts['chart-portfolio'] = new Chart(ctxP, {
    type: 'line', data: { datasets },
    options: {
      ...CD,
      scales: {
        x: {
          type:'linear',
          bounds:'data',
          min: portfolioMinX,
          max: portfolioMaxX,
          grid:{color:SC.grid},
          ticks:{color:SC.tick,font:{family:'Inter',size:11},maxTicksLimit:10,callback:v=>fmtXAxisTick(Number(v))}
        },
        y: { grid:{color:SC.grid}, ticks:{color:SC.tick,font:{family:'Inter',size:11},callback:v=>'€'+v.toLocaleString('es-ES')} }
      },
      plugins: { ...CD.plugins, tooltip: { ...CD.plugins.tooltip, callbacks: { title:items=>fmtTooltipDate(items?.[0]?.parsed?.x), label:c=>` ${c.dataset.label}: ${fmtEur(c.parsed.y)}` } } }
    }
  });

  // Pie composition + list (name, percentage, value)
  const normalizeCompRows = (rows) => (rows || []).map(r => {
    const symbol = String(r.symbol || r.name || '').trim();
    const rawName = String(r.name || '').trim();
    const displayName = (!rawName || rawName === symbol)
      ? (tickerDisplayNameMap[symbol] || rawName || symbol)
      : rawName;
    return { ...r, symbol, displayName };
  });

  // Donut: aggregated composition (includes "Otros" bucket when applicable)
  const pieRows = normalizeCompRows((d.composition && d.composition.length) ? d.composition : (d.composition_full || []));
  const pieTotal = pieRows.reduce((a,b) => a + (Number(b.value) || 0), 0);

  const ctxD = document.getElementById('chart-donut').getContext('2d');
  const pieLabelOf = (row) => {
    const symbol = String(row.symbol || '').trim();
    if (symbol && symbol.toLowerCase() !== 'otros') return symbol;
    return String(row.displayName || row.name || symbol || '').trim();
  };

  charts['chart-donut'] = new Chart(ctxD, {
    type: 'pie',
    plugins: [pieOuterLabelsPlugin, pieInnerPctPlugin],
    data: {
      labels: pieRows.map(c => pieLabelOf(c)),
      datasets: [{
        data: pieRows.map(c => c.value),
        backgroundColor: pieRows.map((_, i) => PIE_COLORS[i % PIE_COLORS.length]),
        radius: '92%',
        borderWidth: 1.2,
        borderColor: cardBg,
        hoverOffset: 6,
      }]
    },
    options: {
      ...CD,
      rotation: 0.87,
      layout: { padding: { left: 28, right: 28, top: 10, bottom: 10 } },
      plugins: {
        ...CD.plugins,
        legend: { display: false },
        pieOuterLabels: {
          enabled: true,
          textColor: getCurrentTheme() === 'dark' ? '#cbd5e1' : '#334155',
          font: '10px Inter',
          offset: 16,
        },
        pieInnerPct: {
          enabled: true,
          minPct: 1,
          radialFactor: 0.58,
          textColor: getCurrentTheme() === 'dark' ? '#e2e8f0' : '#111827',
          font: '600 10px Inter',
        },
        tooltip: {
          ...CD.plugins.tooltip,
          callbacks: {
            label: c => {
              const val = Number(c.raw) || 0;
              const pct = pieTotal > 0 ? (val / pieTotal * 100) : 0;
              const item = pieRows[c.dataIndex] || {};
              const name = item.displayName || item.name || item.symbol || c.label;
              return ` ${name}: ${fmtEur(val)} (${pct.toFixed(1)}%)`;
            }
          }
        }
      }
    }
  });

  // List: full, non-aggregated composition (no "Otros" grouping)
  const listRows = normalizeCompRows(d.composition_full || []);
  const listTotal = listRows.reduce((a,b) => a + (Number(b.value) || 0), 0);
  const listHtml = listRows.length ? listRows.map(row => {
    const val = Number(row.value) || 0;
    const pct = listTotal > 0 ? (val / listTotal * 100) : 0;
    return `<div class="comp-list-row">
      <div class="comp-name" title="${escapeHtml(row.displayName || row.name || row.symbol || '')}">${escapeHtml(row.displayName || row.name || row.symbol || '—')}</div>
      <div class="comp-pct">${pct.toFixed(2)}%</div>
      <div class="comp-val">${fmtEur(val)}</div>
    </div>`;
  }).join('') : `<div class="comp-list-row"><div class="comp-name">Sin datos de composición</div><div class="comp-pct">—</div><div class="comp-val">—</div></div>`;

  document.getElementById('composition-detail-list').innerHTML = `
<div class="comp-list-head">
  <div>Activo</div><div style="text-align:right">%</div><div style="text-align:right">Valor</div>
</div>
${listHtml}
`;

  // Right chart: crypto or top assets
  const ctxR = document.getElementById('chart-right').getContext('2d');
  if (hc && d.crypto_chart) {
    const cryptoSeries = trimSeriesFromFirstPositive(d.crypto_chart.value, d.crypto_chart.invested);
    const xCandidates = [
      ...(cryptoSeries.value || []).map(p => p.x),
      ...(cryptoSeries.invested || []).map(p => p.x),
    ].filter(Number.isFinite);
    const cryptoMinX = xCandidates.length ? Math.min(...xCandidates) : undefined;
    charts['chart-right'] = new Chart(ctxR, {
      type: 'line',
      data: { datasets: [
        { label:'Valor crypto', data:cryptoSeries.value, borderColor:'#10b981', backgroundColor:gradient(ctxR,'rgb(16,185,129)'), fill:true, tension:0.35, pointRadius:0, borderWidth:2.5 },
        { label:'Capital aportado', data:cryptoSeries.invested, borderColor:'#34d399', borderDash:[6,4], fill:false, tension:0, pointRadius:0, borderWidth:1.8 },
      ]},
      options: { ...CD, scales: {
        x:{type:'linear',bounds:'data',min:cryptoMinX,grid:{color:SC.grid},ticks:{color:SC.tick,font:{size:11},maxTicksLimit:8,callback:v=>fmtXAxisTick(Number(v))}},
        y:{grid:{color:SC.grid},ticks:{color:SC.tick,font:{size:11},callback:v=>'€'+v.toLocaleString('es-ES')}}
      }, plugins:{ ...CD.plugins, tooltip:{...CD.plugins.tooltip,callbacks:{title:items=>fmtTooltipDate(items?.[0]?.parsed?.x),label:c=>` ${c.dataset.label}: ${fmtEur(c.parsed.y)}`}} } }
    });

    const cryptoListEl = document.getElementById('crypto-breakdown-detail-list');
    if (cryptoListEl) {
      const rows = normalizeCompRows(d.crypto_breakdown || []);
      const total = Number(d.crypto_total_value) || rows.reduce((acc, row) => acc + (Number(row.value) || 0), 0);
      const body = rows.length ? rows.map(row => {
        const value = Number(row.value) || 0;
        const pct = total > 0 ? (value / total * 100) : 0;
        const display = row.displayName || row.name || row.symbol || '—';
        return `<div class="comp-list-row">
          <div class="comp-name" title="${escapeHtml(display)}">${escapeHtml(display)}</div>
          <div class="comp-pct">${pct.toFixed(2)}%</div>
          <div class="comp-val">${fmtEur(value)}</div>
        </div>`;
      }).join('') : `<div class="comp-list-row"><div class="comp-name">Sin datos crypto</div><div class="comp-pct">—</div><div class="comp-val">—</div></div>`;

      cryptoListEl.innerHTML = `
<div class="comp-list-head">
  <div>Crypto</div><div style="text-align:right">%</div><div style="text-align:right">Valor</div>
</div>
${body}
`;
    }
  } else {
    const top = d.top_assets.slice(0,10);
    charts['chart-right'] = new Chart(ctxR, {
      type: 'bar',
      data: { labels: top.map(t => t.name), datasets: [{ label:'Valor (€)', data: top.map(t => t.value), backgroundColor: COLORS.slice(0,top.length), borderRadius:5, borderSkipped:false }] },
      options: {
        ...CD, indexAxis:'y',
        scales: {
          x:{grid:{color:SC.grid},ticks:{color:SC.tick,font:{size:11},callback:v=>'€'+v.toLocaleString('es-ES')}},
          y:{grid:{display:false},ticks:{color:getCurrentTheme()==='dark'?'#7d8fa8':'#6b7280',font:{size:11}}}
        },
        plugins:{ ...CD.plugins, legend:{display:false}, tooltip:{...CD.plugins.tooltip,callbacks:{label:c=>` ${fmtEur(c.raw)}`}} }
      }
    });
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  OPERATIONS
// ═══════════════════════════════════════════════════════════════════════
async function renderOperations() {
  if (!cache.operations) cache.operations = await api('/api/operations');
  opsAll = cache.operations;
  opsSort.key = 'Date';
  opsSort.dir = 'desc';
  opsPage = 0;
  renderOpsUI(opsAll);
}

function renderOpsUI(data) {
  const tickers = [...new Set(data.map(r => r.ticker).filter(Boolean))].sort();
  const coins   = [...new Set(data.map(r => r.Coin).filter(Boolean))].sort();

  document.getElementById('content').innerHTML = `
<div class="filter-bar">
  <div class="filter-group">
    <span class="filter-label">Ticker</span>
    <select class="f-select" id="f-ticker" onchange="filterOps()" style="min-width:130px">
      <option value="">Todos</option>
      ${tickers.map(t=>`<option value="${t}">${t}</option>`).join('')}
    </select>
  </div>
  <div class="filter-group">
    <span class="filter-label">Moneda</span>
    <select class="f-select" id="f-coin" onchange="filterOps()" style="min-width:100px">
      <option value="">Todas</option>
      ${coins.map(c=>`<option value="${c}">${c}</option>`).join('')}
    </select>
  </div>
  <div class="filter-group">
    <span class="filter-label">Desde</span>
    <input class="f-input" type="date" id="f-from" onchange="filterOps()">
  </div>
  <div class="filter-group">
    <span class="filter-label">Hasta</span>
    <input class="f-input" type="date" id="f-to" onchange="filterOps()">
  </div>
  <div class="filter-group">
    <span class="filter-label">Buscar</span>
    <input class="f-input" type="text" id="f-search" placeholder="Producto / ISIN / Ticker…" oninput="filterOps()" style="min-width:190px">
  </div>
  <button class="btn btn-sm btn-ghost" onclick="clearOpsFilter()">Limpiar</button>
</div>

<div class="card" style="margin-bottom:13px">
  <div class="card-header">
    <span class="card-title">Nueva operación manual</span>
  </div>
  <div class="row-flex">
    <div class="filter-group">
      <span class="filter-label">Fecha</span>
      <input class="f-input" type="date" id="m-op-date">
    </div>
    <div class="filter-group">
      <span class="filter-label">Producto</span>

function clearOpsFilter() {
  ['f-ticker','f-coin'].forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });

}

function opsSortBy(key) {
  if (opsSort.key === key) {
    opsSort.dir = opsSort.dir === 'desc' ? 'asc' : 'desc';
  } else {
    opsSort.key = key;
    opsSort.dir = 'desc';
  }
  opsPage = 0;
  opsFiltered = sortRows(opsFiltered || [], opsSort);
  drawOpsTable(opsFiltered);
}

function filterOps() {
  const ticker = document.getElementById('f-ticker')?.value || '';
  const coin   = document.getElementById('f-coin')?.value   || '';
  const from   = document.getElementById('f-from')?.value;
  const to     = document.getElementById('f-to')?.value;
  const search = (document.getElementById('f-search')?.value||'').toLowerCase();

  let rows = opsAll;
  if (ticker) rows = rows.filter(r => r.ticker === ticker);
  if (coin)   rows = rows.filter(r => r.Coin === coin);
  if (from)   rows = rows.filter(r => r.Date >= from);
  if (to)     rows = rows.filter(r => r.Date <= to);
  if (search) rows = rows.filter(r =>
    (r.Product||'').toLowerCase().includes(search) ||
    (r.ISIN||'').toLowerCase().includes(search) ||
    (r.ticker||'').toLowerCase().includes(search)
  );

  const buys  = rows.filter(r => (r.Quantity||0) > 0).length;
  const sells = rows.filter(r => (r.Quantity||0) < 0).length;

  document.getElementById('ops-stats').innerHTML = `
    ${chip('Total', rows.length)}
    ${chip('Tickers únicos', new Set(rows.map(r=>r.ticker).filter(Boolean)).size)}
    ${chip('Compras', buys, 'green')}
    ${chip('Ventas', sells, 'red')}`;

  opsFiltered = sortRows(rows, opsSort);
  opsPage = 0;
  drawOpsTable(opsFiltered);
}

function drawOpsTable(rows) {
  const start = opsPage * PAGE_SIZE;
  const slice = rows.slice(start, start + PAGE_SIZE);
  const total = rows.length;

  document.getElementById('ops-table').innerHTML = `
<div class="table-wrap">
<table>
<thead><tr>
  <th class="th-sortable" onclick="opsSortBy('Date')">Fecha <span class="sort-arrow">${sortArrow(opsSort, 'Date')}</span></th>
  <th class="th-sortable" onclick="opsSortBy('Product')">Producto <span class="sort-arrow">${sortArrow(opsSort, 'Product')}</span></th>
  <th class="th-sortable" onclick="opsSortBy('ticker')">Ticker <span class="sort-arrow">${sortArrow(opsSort, 'ticker')}</span></th>
  <th class="th-sortable" onclick="opsSortBy('ISIN')">ISIN <span class="sort-arrow">${sortArrow(opsSort, 'ISIN')}</span></th>
  <th class="th-sortable" onclick="opsSortBy('Quantity')" style="text-align:right">Cantidad <span class="sort-arrow">${sortArrow(opsSort, 'Quantity')}</span></th>
  <th class="th-sortable" onclick="opsSortBy('Price')" style="text-align:right">Precio <span class="sort-arrow">${sortArrow(opsSort, 'Price')}</span></th>
  <th class="th-sortable" onclick="opsSortBy('Coin')">Moneda <span class="sort-arrow">${sortArrow(opsSort, 'Coin')}</span></th>
  <th class="th-sortable" onclick="opsSortBy('Value')" style="text-align:right">Valor (€) <span class="sort-arrow">${sortArrow(opsSort, 'Value')}</span></th>
</tr></thead>
<tbody>
${slice.map(r => {
  const q = r.Quantity||0;
  const v = r.Value||0;
  const rowCls = q > 0 ? 'row-buy' : q < 0 ? 'row-sell' : '';
  const arrow = q > 0 ? '↑' : q < 0 ? '↓' : '';
  const productSafe = escapeHtml(r.Product || '');
  return `<tr class="${rowCls}">
    <td class="mono">${r.Date||'—'}</td>
    <td class="bold" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${productSafe}">${productSafe || '—'}</td>
    <td><span class="badge indigo">${r.ticker||'—'}</span></td>
    <td class="mono" style="font-size:11px;color:var(--txt3)">${r.ISIN||'—'}</td>
    <td class="mono ${q>0?'pos':q<0?'neg':''}" style="text-align:right">${arrow} ${fmtNum(Math.abs(q))}</td>
    <td class="mono" style="text-align:right">${fmtNum(r.Price)}</td>
    <td><span class="badge amber">${r.Coin||'—'}</span></td>
    <td class="mono ${v>0?'pos':v<0?'neg':''}" style="text-align:right">${fmtEur(v)}</td>
  </tr>`;
}).join('')}
</tbody>
</table>
</div>`;

  const pages = Math.ceil(total / PAGE_SIZE);
  document.getElementById('ops-pagination').innerHTML = pages <= 1 ? '' : `
    <span class="page-info">Mostrando ${start+1}–${Math.min(start+PAGE_SIZE,total)} de ${total}</span>
    <button class="btn btn-sm" onclick="opsPageChange(-1)" ${opsPage===0?'disabled':''}>← Anterior</button>
    <button class="btn btn-sm" onclick="opsPageChange(1)" ${opsPage>=pages-1?'disabled':''}>Siguiente →</button>`;
}

function opsPageChange(d) {
  const pages = Math.max(1, Math.ceil((opsFiltered?.length || 0) / PAGE_SIZE));
  opsPage = Math.min(Math.max(opsPage + d, 0), pages - 1);
  drawOpsTable(opsFiltered || []);
}

  const keys = Object.keys(d[0]);
  const csv = [keys.join(','), ...d.map(r => keys.map(k => `"${r[k]??''}"`).join(','))].join('\n');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'plusvalias_fifo.csv';
  a.click();
  toast('CSV descargado', 'success');

function dragOver(e,id) { e.preventDefault(); document.getElementById(id).classList.add('drag'); }
function dragLeave(id) { document.getElementById(id).classList.remove('drag'); }
function dropFiles(e,zoneId,inputId) {
  e.preventDefault();
  dragLeave(zoneId);
  const inp = document.getElementById(inputId);
  const dt  = e.dataTransfer;
  if (dt.files.length) {
    inp.files = dt.files;
    previewFiles(inputId, inputId.replace('inp','preview'));
  }
}
function previewFiles(inputId, previewId) {
  const inp = document.getElementById(inputId);
  const prv = document.getElementById(previewId);
  if (!prv) return;
  prv.innerHTML = Array.from(inp.files).map(f =>
    `<div class="file-chip"><i data-lucide="file-text"></i> ${f.name} <span style="color:var(--txt3);font-size:11px;margin-left:4px">(${(f.size/1024).toFixed(1)} KB)</span></div>`
  ).join('');
  refreshIcons();
}
async function uploadFiles(inputId, previewId) {
  const inp = document.getElementById(inputId);
  if (!inp.files.length) { toast('Selecciona al menos un archivo', 'error'); return; }
  const fd = new FormData();
  Array.from(inp.files).forEach(f => fd.append('files', f));
  try {
    const r = await api('/api/upload', { method:'POST', body: fd });
    toast(`${r.saved.length} archivo(s) guardado(s)`, 'success');
    document.getElementById(previewId).innerHTML = '';
    inp.value = '';
    loadPending();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}
async function loadPending() {

    const files = await api('/api/pending-files');
    if (!files.length) {
      list.innerHTML = `<span style="color:var(--txt3);font-size:12.5px">No hay archivos pendientes en input/</span>`;
      return;
    }
    list.innerHTML = files.map(f =>
      `<div class="file-chip"><i data-lucide="file-text"></i>${f}<button class="file-chip-del" onclick="delPending('${f}')" title="Eliminar"><i data-lucide="x"></i></button></div>`
    ).join('');
    refreshIcons();
  } catch(e) { list.innerHTML = `<span style="color:var(--red);font-size:12.5px">${e.message}</span>`; }

async function loadSourceFiles() {
  const list = document.getElementById('source-files-list');
  if (!list) return;
  try {
    const files = await api('/api/source-files');
    if (!files.length) {
      list.innerHTML = `<span style="color:var(--txt3);font-size:12.5px">No hay archivos fuente en input/ — sube uno desde la zona de carga</span>`;

async function delPending(name) {

async function renderSettings() {
  if (!cache.sources) cache.sources = await api('/api/sources');

  const fxAdj      = s.fx_adjustments    || {};

  const cryptoSrcs = s.crypto_sources    || [];

  document.getElementById('content').innerHTML = `

  <button class="stab active" onclick="showTab('prices')">Precios</button>

  <button class="stab" onclick="showTab('crypto-src')">Crypto</button>
  <button class="stab" onclick="showTab('raw')">JSON raw</button>
</div>

<div id="tab-prices" class="stab-content active">
  <div class="hint">
    <strong>Ajustes de precio por ticker</strong><br>
    Algunos proveedores de datos (yfinance) devuelven precios en unidades distintas a la moneda base del activo. Este ajuste divide automáticamente el precio descargado por el divisor que indiques antes de usarlo en cualquier cálculo de valoración, P&amp;L o rentabilidad.<br><br>
    <strong>Cuándo usarlo:</strong> Valores cotizados en peniques en lugar de libras (GBX → divisor 100), fondos cotizados en milésimas de su valor real (divisor 1000), ADRs con ratio diferente al subyacente, o cualquier ticker cuyo precio en yfinance no coincida con el precio que ves en tu broker.<br><br>
    <strong>Consecuencias:</strong> Si el divisor es incorrecto, todos los valores de mercado, ganancias/pérdidas y rentabilidades de ese ticker serán erróneos. Un divisor de 1 (o vacío) significa que el precio se usa tal cual. Los cambios se aplican en la siguiente recarga de datos.
  </div>
  <table class="adj-table"><thead><tr><th>Ticker</th><th>Divisor</th><th></th></tr></thead>
  <tbody id="price-adj-body">
    ${Object.entries(priceAdj).filter(([k])=>k!=='_comment').map(([k,v],i)=>adjRow('p',i,k,v)).join('')}
  </tbody></table>
  <button class="btn btn-sm btn-ghost" onclick="addAdjRow('price-adj-body','p')">+ Añadir fila</button>
  <div style="margin-top:16px"><button class="btn btn-accent" onclick="saveAdj('price')">
    <i data-lucide="save"></i>Guardar ajustes de precios
  </button></div>
</div>

<div id="tab-fx" class="stab-content">
  <div class="hint">
    <strong>Ajustes de tipo de cambio (FX)</strong><br>
    Corrige los tipos de cambio descargados cuando la moneda base de un par no es la unidad estándar. El divisor se aplica al tipo de cambio antes de convertir valores entre divisas.<br><br>
    <strong>Cuándo usarlo:</strong> GBX (peniques esterlinos) requiere divisor 100 para convertir a GBP. Si tienes activos en GBX y no configuras este ajuste, todos los valores en libras quedarán multiplicados por 100, distorsionando completamente la posición en GBP.<br><br>
    <strong>Consecuencias:</strong> Un ajuste FX incorrecto afecta a la conversión de <em>todos</em> los activos denominados en esa divisa, no solo a uno. Revisa siempre que el valor total de cartera en tu moneda base sea coherente tras cualquier cambio. Los ajustes de FX y los ajustes de precio actúan de forma independiente y se combinan si ambos están definidos para el mismo activo.
  </div>

<div id="tab-stocks-src" class="stab-content">

    <strong>Consecuencias:</strong> Desactivar una fuente excluye todas sus posiciones del cálculo de cartera. Si el <code>column_map</code> es incorrecto, los datos se importarán mal o el proceso fallará con error. Para modificar la configuración avanzada usa la pestaña <em>JSON raw</em>.

<div id="tab-crypto-src" class="stab-content">

    <strong>Cuándo usarlo:</strong> Descarga el historial de transacciones desde el exchange, colócalo en la carpeta de datos con el nombre que encaje en el <code>file_pattern</code>, y activa la fuente. El sistema calculará automáticamente posición actual, coste medio y P&amp;L realizados/no realizados.<br><br>
    <strong>Campos clave:</strong> <code>enabled</code> activa o desactiva el exchange; <code>file_pattern</code> selecciona los archivos de ese exchange; <code>column_map</code> mapea las columnas del CSV; <code>buy_operations</code> indica qué tipos de operación se consideran compras (ej. <code>["BUY","DEPOSIT"]</code>); <code>enforce_coins_filter</code> con <code>coins</code> limita el procesamiento a las monedas listadas, ignorando el resto.<br><br>
    <strong>Consecuencias:</strong> Si <code>buy_operations</code> no incluye todos los tipos de compra reales, el coste medio quedará subestimado y el P&amp;L será incorrecto. Activar <code>enforce_coins_filter</code> sin listar todas tus monedas excluirá posiciones del resumen. Para editar la configuración avanzada usa la pestaña <em>JSON raw</em>.
  </div>
  ${cryptoSrcs.map((src,i) => srcCard('cs',i,src)).join('')}

<div id="tab-raw" class="stab-content">

    Acceso completo a toda la configuración del sistema en formato JSON. Aquí puedes editar cualquier campo que las otras pestañas no exponen: añadir o eliminar fuentes enteras, cambiar el benchmark de referencia, reordenar fuentes, o modificar configuraciones avanzadas de column_map y defaults.<br><br>
    <strong>Cuándo usarlo:</strong> Para cambios que van más allá de ajustes de precio/FX: añadir un exchange nuevo, cambiar el ticker del benchmark (ej. <code>IWDA.AS</code> → <code>VWCE.DE</code>), o corregir manualmente una configuración rota. Es también el método recomendado para hacer copias de seguridad: copia el JSON antes de modificar.<br><br>
    <strong>Consecuencias:</strong> Un JSON mal formado impide guardar (se valida antes de escribir). Sin embargo, un JSON válido pero con valores erróneos (un <code>column_map</code> que no existe en el CSV, un ticker de benchmark incorrecto) se guardará sin error y causará fallos en la siguiente carga de datos. <strong>Guarda siempre una copia del JSON antes de hacer cambios significativos.</strong> Los cambios se aplican en la siguiente recarga de datos, no de forma retroactiva.

</div>`;

  refreshIcons();
}

function showTab(name) {
  const tabs = ['prices','fx','stocks-src','crypto-src','raw'];
  document.querySelectorAll('.stab').forEach((b,i) => b.classList.toggle('active', tabs[i] === name));
  document.querySelectorAll('.stab-content').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
}

function adjRow(prefix, i, key='', val=1) {
  return `<tr id="${prefix}-row-${i}">
    <td><input class="adj-input" data-prefix="${prefix}" data-i="${i}" data-field="key" value="${key}" style="width:130px"></td>
    <td><input class="adj-input" data-prefix="${prefix}" data-i="${i}" data-field="val" type="number" value="${val}" min="1" style="width:90px"></td>
    <td><button class="btn btn-sm btn-ghost" onclick="document.getElementById('${prefix}-row-${i}').remove()">✕</button></td>
  </tr>`;
}

function addAdjRow(bodyId, prefix) {
  const body = document.getElementById(bodyId);
  const i = body.querySelectorAll('tr').length;
  body.insertAdjacentHTML('beforeend', adjRow(prefix, i));
}

function readAdj(prefix) {
  const inputs = document.querySelectorAll(`.adj-input[data-prefix="${prefix}"]`);
  const result = {};
  const byRow = {};
  inputs.forEach(inp => {
    const i = inp.dataset.i;
    if (!byRow[i]) byRow[i] = {};
    byRow[i][inp.dataset.field] = inp.value;
  });
  Object.values(byRow).forEach(({key,val}) => {
    if (key && val) result[key.trim()] = parseFloat(val);
  });
  return result;
}

async function saveAdj(type) {
  const s = cache.sources || {};
  if (type === 'price') s.price_adjustments = readAdj('p');
  if (type === 'fx')    s.fx_adjustments    = readAdj('fx');
  await api('/api/sources', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(s)});
  cache.sources = s;
  toast('Ajustes guardados', 'success');
}

async function saveSrcs(type) {
  if (type !== 'stocks') {
    toast('Para cambios avanzados, edita directamente en la pestaña JSON raw', 'info');
    return;
  }
  const s = cache.sources || {};
  const sources = s.stock_sources || [];
  s.stock_sources = sources.map((src, i) => {
    const p = `ss-${i}`;
    const v = id => document.getElementById(id)?.value ?? '';
    return {
      ...src,
      name:         v(`${p}-name`),
      enabled:               document.getElementById(`${p}-enabled`)?.checked ?? src.enabled,
      compute_value_from_price: document.getElementById(`${p}-compute_value`)?.checked ?? src.compute_value_from_price ?? false,
      file_pattern: v(`${p}-file_pattern`),
      column_map: {
        ...(src.column_map || {}),
        Date:     v(`${p}-col-Date`)     || 'date',
        Quantity: v(`${p}-col-Quantity`) || 'available',
        Price:    v(`${p}-col-Price`)    || 'strike_price',
      },
      defaults: {
        ...(src.defaults || {}),
        Product: v(`${p}-def-Product`),
        ISIN:    v(`${p}-def-ISIN`),
        Coin:    v(`${p}-def-Coin`),
        ticker:  v(`${p}-def-ticker`),
      },
    };
  });
  await api('/api/sources', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(s)});
  cache.sources = s;
  toast('Fuentes de acciones guardadas', 'success');
}

async function saveRaw() {
  try {
    const raw = document.getElementById('raw-json').value;
    const parsed = JSON.parse(raw);
    await api('/api/sources', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(parsed)});
    cache.sources = parsed;
    toast('Configuración guardada', 'success');
  } catch(e) { toast('JSON inválido: ' + e.message, 'error'); }
}

// ═══════════════════════════════════════════════════════════════════════
function sc(label, value, delta=null, color='accent') {
  let deltaHtml = '';
  if (delta) {
    const num = parseFloat(delta);
    const cls = posNeg(num);
    const arrow = cls === 'pos' ? '↑' : cls === 'neg' ? '↓' : '';
    deltaHtml = `<div class="sc-delta ${cls}">${arrow} ${delta}</div>`;
  }
  return `<div class="summary-cell ${color}">
    <div class="sc-label">${label}</div>
    <div class="sc-value">${value}</div>
    ${deltaHtml}
  </div>`;
}

function kpi(label, value, delta=null, color='accent') {
  let deltaHtml = '';
  if (delta) {
    const num = parseFloat(delta);
    const cls = posNeg(num);
    const arrow = cls === 'pos' ? '↑' : cls === 'neg' ? '↓' : '';
    deltaHtml = `<div class="kpi-delta ${cls}">${arrow} ${delta}</div>`;
  }
  return `<div class="kpi ${color}">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    ${deltaHtml}
  </div>`;
}

function section(title) {
  return `<div class="section"><h2>${title}</h2><div class="section-line"></div></div>`;
}

function chip(label, value, color='') {
  const c = color ? `color:var(--${color})` : '';
  return `<div class="stat-chip"><div class="stat-chip-label">${label}</div><div class="stat-chip-value" style="${c}">${value}</div></div>`;
}

// ═══════════════════════════════════════════════════════════════════════
//  Toasts
// ═══════════════════════════════════════════════════════════════════════
function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(10px)'; t.style.transition='all .2s'; setTimeout(()=>t.remove(),200); }, 3200);
}

// ═══════════════════════════════════════════════════════════════════════
initTheme();
refreshIcons();
// Always start in Dashboard to avoid restoring stale hash routes (e.g. #tax).
navigate('dashboard');
</script>
